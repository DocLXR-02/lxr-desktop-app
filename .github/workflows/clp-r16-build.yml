name: LXR R16 HP1000 No Parallel Bass Build
on:
  push:
    branches: [fx/clp-hp1000-no-parallel-bass-r16]
permissions:
  contents: read
jobs:
  validate-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Confirm R14 mixer, FX routing and native fader filters unchanged
        shell: bash
        run: |
          set -euo pipefail
          BASE=00ea59d38de6f006dfdbcd472c2cfe5040a440c3
          for f in Core/Src/Soundengine/DSPAudio/mixer.c \
                   Core/Src/Soundengine/FxBus.c \
                   Core/Src/Soundengine/DSPAudio/DrumVoice.c \
                   Core/Src/Soundengine/DSPAudio/Snare.c \
                   Core/Src/Soundengine/DSPAudio/CymbalVoice.c \
                   Core/Src/Soundengine/DSPAudio/HiHat.c \
                   Core/Src/IO/adcPots.c; do
            git show "$BASE:$f" | cmp - "$f"
          done
          echo "R14 MAX, R5 FX-bus reset, route summation and all fader filters unchanged"
      - name: Verify R15 untouched source except HP1 and identification
        shell: bash
        run: |
          set -euo pipefail
          BASE=03bcb4f4e21d368d7a5eda2691ad619bb595d994
          for f in Core/Inc/Soundengine/DSPAudio/FX/Distortion.h \
                   Core/Src/Soundengine/DSPAudio/mixer.c \
                   Core/Src/Soundengine/FxBus.c \
                   Core/Src/Soundengine/DSPAudio/DrumVoice.c \
                   Core/Src/Soundengine/DSPAudio/Snare.c \
                   Core/Src/Soundengine/DSPAudio/CymbalVoice.c \
                   Core/Src/Soundengine/DSPAudio/HiHat.c \
                   Core/Src/IO/adcPots.c; do
            git show "$BASE:$f" | cmp - "$f"
          done
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          base=subprocess.check_output(['git','show','03bcb4f4e21d368d7a5eda2691ad619bb595d994:Core/Src/Soundengine/DSPAudio/FX/Distortion.c']).decode().replace('\r\n','\n')
          cur=Path('Core/Src/Soundengine/DSPAudio/FX/Distortion.c').read_text()
          delta=base.replace('0.015536190543605555','0.13267953435832913').replace('110 Hz','1000 Hz').replace('110/44140','1000/44140')
          assert cur==delta, 'Unexpected R16 DSP change beyond HP1'
          oldmain=subprocess.check_output(['git','show','03bcb4f4e21d368d7a5eda2691ad619bb595d994:Core/Src/main.c']).decode().replace('\r\n','\n')
          assert Path('Core/Src/main.c').read_text()==oldmain.replace('LXR LAB R15','LXR LAB R16')
          print('PASS: R16 production change restricted to HP1 coefficient/comment and splash')
          PY
      - name: R7-derived production DSP and regression tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/r16-evidence build/r16-host
          cc --version > build/r16-evidence/HOST_COMPILER.txt
          CC_FLAGS="-std=c11 -O2 -fno-strict-aliasing -fsanitize=undefined,bounds,float-cast-overflow -fno-sanitize-recover=all -I. -Itests/fx_clip/include -ICore/Inc"
          cc $CC_FLAGS -DDISTORTION_SOURCE='"Core/Src/Soundengine/DSPAudio/FX/Distortion.c"' tests/fx_clip_r15/unit.c -lm -o build/r16-host/inherited
          ./build/r16-host/inherited | tee build/r16-evidence/inherited.log
          cc $CC_FLAGS -DDISTORTION_SOURCE='"Core/Src/Soundengine/DSPAudio/FX/Distortion.c"' tests/fx_clip_r15/state.c -lm -o build/r16-host/state
          ./build/r16-host/state | tee build/r16-evidence/state.log
          cc $CC_FLAGS -ffunction-sections -fdata-sections tests/fx_clip/fxbus.c Core/Src/Soundengine/DSPAudio/FX/Distortion.c Core/Src/Soundengine/FxBus.c -Wl,--gc-sections -lm -o build/r16-host/bus
          ./build/r16-host/bus | tee build/r16-evidence/bus.log
          python3 tests/fx_clip_r16/compare.py 2>&1 | tee build/r16-evidence/1000hz-retune-parity.log
          python3 tests/fx_clip_r14/max_control.py 2>&1 | tee build/r16-evidence/max-control.log
          python3 tests/bug001/run.py 2>&1 | tee build/r16-evidence/bug001.log
          python3 tests/kit_load/run.py 2>&1 | tee build/r16-evidence/kit-load.log
          python3 tests/project_storage/run.py 2>&1 | tee build/r16-evidence/storage.log
          python3 tests/euclidean/run.py 2>&1 | tee build/r16-evidence/euclidean.log
      - name: Install matched R7 ARM toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://armkeil.blob.core.windows.net/developer/Files/downloads/gnu/14.3.rel1/binrel/arm-gnu-toolchain-14.3.rel1-x86_64-arm-none-eabi.tar.xz -o "$RUNNER_TEMP/arm-toolchain.tar.xz"
          sha256sum "$RUNNER_TEMP/arm-toolchain.tar.xz" > build/r16-evidence/TOOLCHAIN_ARCHIVE_SHA256.txt
          tar -xJf "$RUNNER_TEMP/arm-toolchain.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/arm-gnu-toolchain-14.3.rel1-x86_64-arm-none-eabi/bin" >> "$GITHUB_PATH"
      - name: One Release ARM build
        shell: bash
        run: |
          set -euo pipefail
          cmake --preset release 2>&1 | tee build/r16-evidence/configure.log
          cmake --build --preset release --parallel 2 2>&1 | tee build/r16-evidence/build.log
      - name: Validate application and retain reproducible evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/fx_clip_r16/package.py 2>&1 | tee build/r16-evidence/image-validation.log
          cp build/r16-validation.json build/r16-evidence/
          cp build/release/LXR_V2_STM32F765.elf build/release/LXR_V2_STM32F765.map build/release/compile_commands.json build/r16-evidence/
          arm-none-eabi-size -A build/release/LXR_V2_STM32F765.elf > build/r16-evidence/R16_SECTIONS.txt
          arm-none-eabi-gcc --version > build/r16-evidence/TOOLCHAIN.txt
          git rev-parse HEAD > build/r16-evidence/SOURCE_COMMIT.txt
          git archive --format=zip --output=build/r16-evidence/SOURCE.zip HEAD
          sha256sum build/r16-delivery/* build/r16-evidence/SOURCE.zip > build/r16-evidence/SHA256SUMS
      - name: Upload R16 image
        uses: actions/upload-artifact@v4
        with:
          name: lxr-r16-image
          path: build/r16-delivery/
          retention-days: 30
          if-no-files-found: error
      - name: Upload source/build evidence
        uses: actions/upload-artifact@v4
        with:
          name: lxr-r16-source-build-evidence
          path: build/r16-evidence/
          retention-days: 30
          if-no-files-found: error
