name: R25 DIAG 01-C host and matched ARM validation
on:
  push:
    branches:
      - candidate/r25-diag01-r22
permissions:
  contents: read
jobs:
  r25-diag01-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record source identity
        run: |
          mkdir -p build/r25-diag01-evidence
          git rev-parse HEAD | tee build/r25-diag01-evidence/SOURCE_SHA.txt
          git -c core.whitespace=cr-at-eol diff --check HEAD^ HEAD
      - name: DIAG session and real overlay host fixtures
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c11 -O2 -Wall -Wextra -Werror -fsanitize=undefined,bounds -fno-sanitize-recover=all -DLXR_RUNTIME_DIAGNOSTICS=1 -Itests/diag01 -ICore/Inc -ICore/Src/menu Core/Src/safety/runtimeDiagnostics.c tests/diag01/host.c -o build/diag01-host
          build/diag01-host 2>&1 | tee build/r25-diag01-evidence/diag-host.log
          cc -std=c11 -Wall -Wextra -Werror -ICore/Inc tests/diag01/off.c -o build/diag01-off
          build/diag01-off 2>&1 | tee build/r25-diag01-evidence/diag-off.log
          echo PASS OFF macros | tee -a build/r25-diag01-evidence/diag-off.log
      - name: R22 direct transfer, selector and project round trips
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/r21_voice_copy/run.py 2>&1 | tee build/r25-diag01-evidence/r21-host.log
          python3 tests/r22_drum_copy/run.py 2>&1 | tee build/r25-diag01-evidence/r22-host.log
          python3 tests/bug001/run.py 2>&1 | tee build/r25-diag01-evidence/parameter-sweeps.log
      - name: Compile and exercise standalone capture state machine
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c11 -O2 -Wall -Wextra -Werror -fsanitize=undefined,bounds -fno-sanitize-recover=all \
            -ICore/Inc Core/Src/Soundengine/Sequencer/automationCapture.c tests/bug008/host.c \
            -o build/r25-diag01-evidence/bug008-host
          build/r25-diag01-evidence/bug008-host 2>&1 | tee build/r25-diag01-evidence/bug008-host.log
      - name: Playback numerical regression (exhaustive fixed-8 equivalence)
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c11 -O2 -Wall -Wextra -Werror -fsanitize=undefined,bounds -fno-sanitize-recover=all \
            -ICore/Inc Core/Src/Soundengine/Sequencer/automationPlayback.c tests/automation_playback/host.c \
            -o build/r25-diag01-evidence/playback-host
          build/r25-diag01-evidence/playback-host 2>&1 | tee build/r25-diag01-evidence/playback-host.log
      - name: R20 host conflict and LCD timing regression
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/r20_ui/run.py 2>&1 | tee build/r25-diag01-evidence/r20-ui-host.log
          python3 tests/r20_ui/integration/probe.py . build/r20-ui-host 2>&1 | tee build/r25-diag01-evidence/r20-ui-integration.log
      - name: Verify adaptive source and extra menu choices removed
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -E 'PAR_AUTO_RES|PAR_AUTO_ALG|MENU_AUTO_RES|MENU_AUTO_ALG|SEQ_SET_AUTO_RES|SEQ_SET_AUTO_ALG|chooseDivisions|seq_playbackAdaptive|seq_playbackResolution|autoAlgNames|autoResNames' \
            Core/Inc Core/Src || exit 1
          grep -q 'lane->divisions = 8u;' Core/Src/Soundengine/Sequencer/automationPlayback.c
          grep -q 'PAR_AUTOM_TRACK.*PAR_REC_MODE.*PAR_NONE.*PAR_NONE' Core/Inc/menu/menuPages.h
          grep -q 'PAR_REC_MODE - PAR_BEGINNING_OF_GLOBALS' Core/Src/Preset/presetManager.c
      - name: Existing globals and project storage regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/project_storage/run.py 2>&1 | tee build/r25-diag01-evidence/project-storage.log
          python3 tests/project_transaction/run.py 2>&1 | tee build/r25-diag01-evidence/project-transaction.log
      - name: Reuse R19 regressions for USB-MIDI, Delay and Compressor
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/r18_delay_mono/run.py build/f8-delay 2>&1 | tee build/r25-diag01-evidence/delay.log
          python3 tests/r18_usb_midi/run.py build/f8-usb 2>&1 | tee build/r25-diag01-evidence/usb.log
          python3 tests/r18_compressor_mono/run.py build/f8-compressor 2>&1 | tee build/r25-diag01-evidence/compressor.log
          python3 tests/fx_clip_r18/compare.py 2>&1 | tee build/r25-diag01-evidence/clp-compare.log
      - name: Install R19-matched ARM GNU Toolchain 14.3.rel1
        shell: bash
        run: |
          set -euo pipefail
          URL=https://armkeil.blob.core.windows.net/developer/Files/downloads/gnu/14.3.rel1/binrel/arm-gnu-toolchain-14.3.rel1-x86_64-arm-none-eabi.tar.xz
          curl -fL --retry 3 "$URL" -o "$RUNNER_TEMP/arm-toolchain.tar.xz"
          echo "8f6903f8ceb084d9227b9ef991490413014d991874a1e34074443c2a72b14dbd  $RUNNER_TEMP/arm-toolchain.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/arm-toolchain.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/arm-gnu-toolchain-14.3.rel1-x86_64-arm-none-eabi/bin" >> "$GITHUB_PATH"
      - name: Matched OFF and ON ARM builds (not for flashing)
        shell: bash
        run: |
          set -euo pipefail
          o=build/r25-diag01-evidence
          arm-none-eabi-gcc --version > "$o/COMPILER.txt"
          echo "VALIDATION ONLY; BOOT STRING NOT YET CHANGED; DO NOT FLASH" > "$o/NOT_FOR_FLASHING.txt"
          for mode in OFF ON; do
            d="$o/$mode"
            b="build/diag-$mode"
            mkdir -p "$d"
            cmake --preset release -B "$b" -DLXR_RUNTIME_DIAGNOSTICS="$mode" -DCMAKE_C_FLAGS=-fstack-usage 2>&1 | tee "$d/configure.log"
            cmake --build "$b" --parallel 2 2>&1 | tee "$d/build.log"
            cp "$b"/LXR_V2_STM32F765.{elf,map} "$b"/LXR_V2_V1.7.img "$b"/CMakeCache.txt "$b"/compile_commands.json "$d/"
            arm-none-eabi-size -A "$d/LXR_V2_STM32F765.elf" > "$d/sections.txt"
            arm-none-eabi-nm -S "$d/LXR_V2_STM32F765.elf" > "$d/symbols.txt"
            arm-none-eabi-objdump -d "$d/LXR_V2_STM32F765.elf" > "$d/disassembly.txt"
            find "$b" -name '*.su' -print -exec cat {} \; > "$d/stack-usage.txt"
            (cd "$d" && sha256sum *.elf *.map *.img > OUTPUT_SHA256SUMS.txt)
          done
      - name: Verify ARM image and compare static memory
        run: python3 tests/diag01/validate_arm.py
      - name: Preserve evidence also on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r25-diag01-validation-evidence
          path: build/r25-diag01-evidence/
          retention-days: 30
          if-no-files-found: error
