name: R23 integrated four real DSP FX host validation
on:
  push:
    branches:
      - experiment/r23-real-dsp-integration-2026-11-18
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-four-dsp:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify source pin, test-only diff and toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/r23-real-dsp-integration
          git rev-parse HEAD > build/r23-real-dsp-integration/TEST_SHA.txt
          git merge-base --is-ancestor 238389475359f11bf317b446e668e0c82333c231 HEAD
          git diff --check 238389475359f11bf317b446e668e0c82333c231 HEAD
          git diff --name-only 238389475359f11bf317b446e668e0c82333c231 HEAD | tee build/r23-real-dsp-integration/CHANGED_FILES.txt
          cc --version > build/r23-real-dsp-integration/TOOLCHAIN.txt
      - name: Build and test actual four-effect DSP under sanitizers
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/r23_real_fx/run.py 2>&1 | tee build/r23-real-dsp-integration/results.log
      - name: Preserve complete host evidence on PASS and STOP
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r23-four-real-dsp-host-evidence
          path: |
            build/r23-real-dsp-integration/*.log
            build/r23-real-dsp-integration/*.txt
            build/r23-real-dsp-integration/*.sha256
            build/r23-real-dsp-integration/*.c
          retention-days: 30
          if-no-files-found: warn
