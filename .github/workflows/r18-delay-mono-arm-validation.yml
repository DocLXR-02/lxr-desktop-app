name: R18 Delay mono ARM validation only
on:
  push:
    branches:
      - fix/r18-delay-mono-safe-access
permissions:
  contents: read
jobs:
  arm-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify protected R18 ancestry and authorized source diff
        shell: bash
        run: |
          set -euo pipefail
          BASE=41b364067bce0d8cde624c184933d9cb88e2725b
          mkdir -p build/r18-delay-arm-evidence
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --name-only "$BASE" HEAD > build/r18-delay-arm-evidence/CHANGED_PATHS.txt
          diff -u <(printf '%s\n' \
            '.github/workflows/r18-delay-mono-arm-validation.yml' \
            '.github/workflows/r18-delay-mono-host.yml' \
            'Core/Src/Soundengine/DSPAudio/FX/Delay.c' \
            'tests/r18_delay_mono/run.py' \
            'tests/r18_delay_mono/validate_arm.py') build/r18-delay-arm-evidence/CHANGED_PATHS.txt
          git -c core.whitespace=cr-at-eol diff --check "$BASE" HEAD
          test "$(git hash-object Core/Src/Soundengine/DSPAudio/FX/Delay.c)" = 1a4bbac4021efe9e0c0d9cfa9bee317e5a51e6e6
          for f in \
            Core/Src/Soundengine/DSPAudio/FX/Distortion.c \
            Core/Inc/Soundengine/DSPAudio/FX/Distortion.h \
            Core/Src/Soundengine/DSPAudio/mixer.c \
            Core/Src/Soundengine/FxBus.c \
            Core/Src/Soundengine/DSPAudio/FX/Compressor.c \
            Core/Src/Soundengine/USB/usb_manager.c \
            Core/Src/main.c; do
            git show "$BASE:$f" | cmp - "$f"
          done
          git rev-parse HEAD > build/r18-delay-arm-evidence/SOURCE_COMMIT.txt
          git rev-parse "$BASE" > build/r18-delay-arm-evidence/ACCEPTED_R18_COMMIT.txt
          git diff --numstat "$BASE" HEAD > build/r18-delay-arm-evidence/CHANGED_LINES.txt
          cc --version > build/r18-delay-arm-evidence/HOST_COMPILER.txt
          echo "PASS: accepted R18 and CLP source unchanged; exactly one approved production file differs"
      - name: Host Delay sanitizer and R18 CLP baseline regression
        shell: bash
        run: |
          set -euo pipefail
          EVID=build/r18-delay-arm-evidence
          python3 tests/r18_delay_mono/run.py build/r18-delay-arm-host 2>&1 | tee "$EVID/delay-host.log"
          CC_FLAGS="-std=c11 -O2 -fno-strict-aliasing -fsanitize=undefined,bounds,float-cast-overflow -fno-sanitize-recover=all -I. -Itests/fx_clip/include -ICore/Inc"
          mkdir -p build/r18-delay-arm-host
          cc $CC_FLAGS -DDISTORTION_SOURCE='"Core/Src/Soundengine/DSPAudio/FX/Distortion.c"' tests/fx_clip_r18/unit.c -lm -o build/r18-delay-arm-host/clp-unit
          build/r18-delay-arm-host/clp-unit 2>&1 | tee "$EVID/clp-unit.log"
          cc $CC_FLAGS -DDISTORTION_SOURCE='"Core/Src/Soundengine/DSPAudio/FX/Distortion.c"' tests/fx_clip_r18/state.c -lm -o build/r18-delay-arm-host/clp-state
          build/r18-delay-arm-host/clp-state 2>&1 | tee "$EVID/clp-state.log"
          cc $CC_FLAGS -DDISTORTION_SOURCE='"Core/Src/Soundengine/DSPAudio/FX/Distortion.c"' tests/fx_clip_r18/mix_bounds.c -lm -o build/r18-delay-arm-host/clp-mix
          build/r18-delay-arm-host/clp-mix 2>&1 | tee "$EVID/clp-mix.log"
          python3 tests/fx_clip_r18/compare.py 2>&1 | tee "$EVID/clp-core.log"
          python3 tests/fx_clip_r14/max_control.py 2>&1 | tee "$EVID/clp-max.log"
      - name: Install exact R18 matched ARM toolchain
        shell: bash
        run: |
          set -euo pipefail
          URL=https://armkeil.blob.core.windows.net/developer/Files/downloads/gnu/14.3.rel1/binrel/arm-gnu-toolchain-14.3.rel1-x86_64-arm-none-eabi.tar.xz
          curl -fL --retry 3 "$URL" -o "$RUNNER_TEMP/arm-toolchain.tar.xz"
          echo "8f6903f8ceb084d9227b9ef991490413014d991874a1e34074443c2a72b14dbd  $RUNNER_TEMP/arm-toolchain.tar.xz" | sha256sum --check
          sha256sum "$RUNNER_TEMP/arm-toolchain.tar.xz" > build/r18-delay-arm-evidence/TOOLCHAIN_ARCHIVE_SHA256.txt
          tar -xJf "$RUNNER_TEMP/arm-toolchain.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/arm-gnu-toolchain-14.3.rel1-x86_64-arm-none-eabi/bin" >> "$GITHUB_PATH"
      - name: One Release ARM validation build (not a firmware delivery)
        shell: bash
        run: |
          set -euo pipefail
          cmake --preset release 2>&1 | tee build/r18-delay-arm-evidence/configure.log
          cmake --build --preset release --parallel 2 2>&1 | tee build/r18-delay-arm-evidence/build.log
      - name: Validate ELF and application image and record resources
        shell: bash
        run: |
          set -euo pipefail
          EVID=build/r18-delay-arm-evidence
          python3 tests/r18_delay_mono/validate_arm.py 2>&1 | tee "$EVID/validation.log"
          cp build/release/LXR_V2_STM32F765.elf "$EVID/"
          cp build/release/LXR_V2_STM32F765.map "$EVID/"
          cp build/release/compile_commands.json "$EVID/"
          cp build/release/LXR_V2_V1.7.img "$EVID/LXR_R18_Delay_Mono_ARM_VALIDATION_ONLY.img"
          arm-none-eabi-gcc --version > "$EVID/ARM_COMPILER.txt"
          git archive --format=zip --output="$EVID/SOURCE.zip" HEAD
          cat > "$EVID/NOT_FOR_FLASHING.txt" <<'EOF'
          This is an ARM validation artifact, not an approved firmware release or installation image.
          It derives from the R18 musical reference and carries the R18 boot identifier.
          No permission to flash, install, merge, or replace the accepted R18 firmware is implied.
          CPU timing, IRQ/DMA deadlines, stack high-water and on-device audio remain unmeasured.
          EOF
          (cd "$EVID" && sha256sum \
            LXR_R18_Delay_Mono_ARM_VALIDATION_ONLY.img \
            LXR_V2_STM32F765.elf LXR_V2_STM32F765.map \
            SOURCE.zip ARM_VALIDATION.json > VERIFIED_HASHES.txt)
      - name: Preserve build evidence even on failure
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          EVID=build/r18-delay-arm-evidence
          mkdir -p "$EVID"
          git rev-parse HEAD > "$EVID/CI_HEAD.txt"
          (cd "$EVID" && sha256sum *.log *.txt *.json 2>/dev/null > RECORD_HASHES.txt) || true
      - name: Upload non-release ARM validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r18-delay-mono-arm-validation-evidence
          path: build/r18-delay-arm-evidence/
          retention-days: 30
          if-no-files-found: error
