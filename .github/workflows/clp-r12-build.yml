name: LXR R12 Six Independent Mono CLP Offline Candidate
on:
  push:
    branches: [fx/clp-six-mono-r12-candidate]
permissions:
  contents: read
jobs:
  validate-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Focused production host tests and regressions
        run: |
          set -euo pipefail
          mkdir -p build/r12-evidence
          cc --version > build/r12-evidence/HOST_COMPILER.txt
          python3 -m pip install numpy==2.3.5
          python3 tests/fx_clip_r12/scope.py 2>&1 | tee build/r12-evidence/scope.log
          python3 tests/fx_clip_r12/component.py 2>&1 | tee build/r12-evidence/component.log
          python3 tests/fx_clip_r12/run.py 2>&1 | tee build/r12-evidence/integration.log
          python3 tests/fx_clip_r12/regressions.py 2>&1 | tee build/r12-evidence/numeric-regressions.log
          python3 tests/fx_clip_r12/renders.py 2>&1 | tee build/r12-evidence/renders.log
          python3 tests/bug001/run.py 2>&1 | tee build/r12-evidence/bug001.log
          python3 tests/kit_load/run.py 2>&1 | tee build/r12-evidence/kit-load.log
          python3 tests/project_storage/run.py 2>&1 | tee build/r12-evidence/storage.log
          python3 tests/euclidean/run.py 2>&1 | tee build/r12-evidence/euclidean.log
      - name: Install established Arm toolchain
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://armkeil.blob.core.windows.net/developer/Files/downloads/gnu/14.3.rel1/binrel/arm-gnu-toolchain-14.3.rel1-x86_64-arm-none-eabi.tar.xz -o "$RUNNER_TEMP/arm-toolchain.tar.xz"
          echo "8f6903f8ceb084d9227b9ef991490413014d991874a1e34074443c2a72b14dbd  $RUNNER_TEMP/arm-toolchain.tar.xz" | sha256sum -c -
          sha256sum "$RUNNER_TEMP/arm-toolchain.tar.xz" > build/r12-evidence/TOOLCHAIN_ARCHIVE_SHA256.txt
          tar -xJf "$RUNNER_TEMP/arm-toolchain.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/arm-gnu-toolchain-14.3.rel1-x86_64-arm-none-eabi/bin" >> "$GITHUB_PATH"
      - name: One final Release ARM build
        run: |
          set -euo pipefail
          cmake --preset release 2>&1 | tee build/r12-evidence/configure.log
          cmake --build --preset release --parallel 2 2>&1 | tee build/r12-evidence/build.log
      - name: Validate offline candidate and preserve evidence
        run: |
          set -euo pipefail
          python3 tests/fx_clip_r12/package.py
          python3 tests/fx_clip_r12/stack.py 2>&1 | tee build/r12-evidence/stack.log
          cp build/r12-validation.json build/r12-evidence/
          cp build/release/LXR_V2_STM32F765.elf build/release/LXR_V2_STM32F765.map build/release/compile_commands.json build/r12-evidence/
          find build/r12-* -type f \( -name '*.json' -o -name '*.wav' -o -name '*.log' \) -not -path 'build/r12-evidence/*' -not -path '*/r11/*' -print0 | tar --null -T - -czf build/r12-evidence/HOST_RESULTS.tar.gz
          arm-none-eabi-objdump -d build/release/LXR_V2_STM32F765.elf > build/r12-evidence/DISASSEMBLY.txt
          arm-none-eabi-readelf -l build/release/LXR_V2_STM32F765.elf > build/r12-evidence/ELF_LOADS.txt
          arm-none-eabi-size -A build/release/LXR_V2_STM32F765.elf > build/r12-evidence/R12_SECTIONS.txt
          arm-none-eabi-gcc --version > build/r12-evidence/TOOLCHAIN.txt
          git rev-parse HEAD > build/r12-evidence/SOURCE_COMMIT.txt
          git archive --format=zip --output=build/r12-evidence/SOURCE.zip HEAD
          sha256sum build/r12-delivery/* > build/r12-evidence/SHA256SUMS
          find build/r12-evidence -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum >> build/r12-evidence/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lxr-r12-source-build-evidence
          path: build/r12-evidence/
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: lxr-r12-offline-candidate
          path: build/r12-delivery/
          retention-days: 90
          if-no-files-found: error
