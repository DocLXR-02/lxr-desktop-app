name: LXR R18 CLP V2.1 Output Crossover Build
on:
  push:
    branches: [fx/clp-v21-200hz-soft-r18]
permissions:
  contents: read
jobs:
  validate-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact R18 production sources and unchanged R14 routing
        shell: bash
        run: |
          set -euo pipefail
          BASE=00ea59d38de6f006dfdbcd472c2cfe5040a440c3
          for f in Core/Src/Soundengine/DSPAudio/mixer.c \
                   Core/Src/Soundengine/FxBus.c \
                   Core/Src/Soundengine/DSPAudio/DrumVoice.c \
                   Core/Src/Soundengine/DSPAudio/Snare.c \
                   Core/Src/Soundengine/DSPAudio/CymbalVoice.c \
                   Core/Src/Soundengine/DSPAudio/HiHat.c \
                   Core/Src/IO/adcPots.c; do
            git show "$BASE:$f" | cmp - "$f"
          done
          test "$(git hash-object Core/Inc/Soundengine/DSPAudio/FX/Distortion.h)" = d5d5b715de4f94bd9e9e81e2e6fe9f4db117a35e
          test "$(git hash-object Core/Src/Soundengine/DSPAudio/FX/Distortion.c)" = ffdba00969e33a606f9ff66094ffdbfc04d68add
          test "$(git hash-object Core/Src/main.c)" = f586724462f8d2d81552bd4a89d2884b992fe1d4
          echo "PASS exact locally host-tested R18 production files and R14 MAX routing"
      - name: R7-derived production DSP and regression tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/r18-evidence build/r18-host
          cc --version > build/r18-evidence/HOST_COMPILER.txt
          CC_FLAGS="-std=c11 -O2 -fno-strict-aliasing -fsanitize=undefined,bounds,float-cast-overflow -fno-sanitize-recover=all -I. -Itests/fx_clip/include -ICore/Inc"
          cc $CC_FLAGS -DDISTORTION_SOURCE='"Core/Src/Soundengine/DSPAudio/FX/Distortion.c"' tests/fx_clip_r18/unit.c -lm -o build/r18-host/inherited
          ./build/r18-host/inherited | tee build/r18-evidence/inherited.log
          cc $CC_FLAGS -DDISTORTION_SOURCE='"Core/Src/Soundengine/DSPAudio/FX/Distortion.c"' tests/fx_clip_r18/state.c -lm -o build/r18-host/state
          ./build/r18-host/state | tee build/r18-evidence/state.log
          cc $CC_FLAGS -ffunction-sections -fdata-sections tests/fx_clip/fxbus.c Core/Src/Soundengine/DSPAudio/FX/Distortion.c Core/Src/Soundengine/FxBus.c -Wl,--gc-sections -lm -o build/r18-host/bus
          ./build/r18-host/bus | tee build/r18-evidence/bus.log
          cc $CC_FLAGS -DDISTORTION_SOURCE='"Core/Src/Soundengine/DSPAudio/FX/Distortion.c"' tests/fx_clip_r18/mix_bounds.c -lm -o build/r18-host/mix-bounds
          ./build/r18-host/mix-bounds | tee build/r18-evidence/mix-bounds.log
          python3 tests/fx_clip_r18/compare.py 2>&1 | tee build/r18-evidence/core-isolation.log
          python3 tests/fx_clip_r14/max_control.py 2>&1 | tee build/r18-evidence/max-control.log
          python3 tests/bug001/run.py 2>&1 | tee build/r18-evidence/bug001.log
          python3 tests/kit_load/run.py 2>&1 | tee build/r18-evidence/kit-load.log
          python3 tests/project_storage/run.py 2>&1 | tee build/r18-evidence/storage.log
          python3 tests/euclidean/run.py 2>&1 | tee build/r18-evidence/euclidean.log
      - name: Install matched R7 ARM toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://armkeil.blob.core.windows.net/developer/Files/downloads/gnu/14.3.rel1/binrel/arm-gnu-toolchain-14.3.rel1-x86_64-arm-none-eabi.tar.xz -o "$RUNNER_TEMP/arm-toolchain.tar.xz"
          sha256sum "$RUNNER_TEMP/arm-toolchain.tar.xz" > build/r18-evidence/TOOLCHAIN_ARCHIVE_SHA256.txt
          tar -xJf "$RUNNER_TEMP/arm-toolchain.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/arm-gnu-toolchain-14.3.rel1-x86_64-arm-none-eabi/bin" >> "$GITHUB_PATH"
      - name: One Release ARM build
        shell: bash
        run: |
          set -euo pipefail
          cmake --preset release 2>&1 | tee build/r18-evidence/configure.log
          cmake --build --preset release --parallel 2 2>&1 | tee build/r18-evidence/build.log
      - name: Validate application and retain reproducible evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/fx_clip_r18/package.py 2>&1 | tee build/r18-evidence/image-validation.log
          cp build/r18-validation.json build/r18-evidence/
          cp build/release/LXR_V2_STM32F765.elf build/release/LXR_V2_STM32F765.map build/release/compile_commands.json build/r18-evidence/
          arm-none-eabi-size -A build/release/LXR_V2_STM32F765.elf > build/r18-evidence/R18_SECTIONS.txt
          arm-none-eabi-gcc --version > build/r18-evidence/TOOLCHAIN.txt
          git rev-parse HEAD > build/r18-evidence/SOURCE_COMMIT.txt
          git archive --format=zip --output=build/r18-evidence/SOURCE.zip HEAD
          sha256sum build/r18-delivery/* build/r18-evidence/SOURCE.zip > build/r18-evidence/SHA256SUMS
      - name: Upload R18 image
        uses: actions/upload-artifact@v4
        with:
          name: lxr-r18-image
          path: build/r18-delivery/
          retention-days: 30
          if-no-files-found: error
      - name: Upload source/build evidence
        uses: actions/upload-artifact@v4
        with:
          name: lxr-r18-source-build-evidence
          path: build/r18-evidence/
          retention-days: 30
          if-no-files-found: error
