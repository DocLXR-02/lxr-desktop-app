name: R18 Compressor mono ARM validation only
on:
  push:
    branches:
      - validation/r18-compressor-mono-arm-2026-11-05
permissions:
  contents: read
jobs:
  arm-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pin exact host-tested compressor source and preserve accepted R18
        shell: bash
        run: |
          set -euo pipefail
          COMP=ff8f7ae5a7217f65928318f23e8c69b1e6a22485
          R18=41b364067bce0d8cde624c184933d9cb88e2725b
          EVID=build/r18-compressor-arm-evidence
          mkdir -p "$EVID"
          test "$(git rev-parse HEAD^)" = "$COMP"
          git merge-base --is-ancestor "$R18" "$COMP"
          git diff --name-only "$COMP" HEAD > "$EVID/BUILD_ONLY_CHANGED_PATHS.txt"
          diff -u <(printf '%s\n' \
            '.github/workflows/r18-compressor-mono-arm-validation.yml' \
            'tests/r18_compressor_mono/validate_arm.py') "$EVID/BUILD_ONLY_CHANGED_PATHS.txt"
          git diff --name-only "$R18" "$COMP" > "$EVID/COMPRESSOR_CANDIDATE_CHANGED_PATHS.txt"
          diff -u <(printf '%s\n' \
            '.github/workflows/r18-compressor-mono-host.yml' \
            'Core/Src/Soundengine/DSPAudio/FX/Compressor.c' \
            'tests/r18_compressor_mono/run.py') "$EVID/COMPRESSOR_CANDIDATE_CHANGED_PATHS.txt"
          git -c core.whitespace=cr-at-eol diff --check "$R18" HEAD
          test "$(git hash-object Core/Src/Soundengine/DSPAudio/FX/Compressor.c)" = 7bb84666575c0a35e93e10563aa5b5c559432030
          for f in \
            Core/Src/Soundengine/DSPAudio/FX/Distortion.c \
            Core/Src/Soundengine/DSPAudio/FX/Delay.c \
            Core/Src/Soundengine/DSPAudio/mixer.c \
            Core/Src/Soundengine/FxBus.c \
            Core/Src/Soundengine/USB/usb_manager.c \
            Middlewares/JS/STM32_USB_Device_Library/Class/CDC/Src/usbd_cdc.c \
            Middlewares/JS/STM32_USB_Device_Library/Class/CDC/Inc/usbd_cdc.h \
            Core/Src/main.c; do
            git show "$R18:$f" | cmp - "$f"
          done
          git rev-parse HEAD > "$EVID/BUILD_COMMIT.txt"
          git rev-parse "$COMP" > "$EVID/COMPRESSOR_CANDIDATE_COMMIT.txt"
          git rev-parse "$R18" > "$EVID/ACCEPTED_R18_COMMIT.txt"
          cc --version > "$EVID/HOST_COMPILER.txt"
          echo 'PASS: exact compressor candidate, only build/test files added, unchanged protected R18 audio/USB'
      - name: Repeat compressor host sanitizer and normal-range parity suite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/r18-compressor-arm-host
          python3 tests/r18_compressor_mono/run.py build/r18-compressor-arm-host 2>&1 | tee build/r18-compressor-arm-evidence/compressor-host.log
          (cd build/r18-compressor-arm-host && sha256sum --check SHA256SUMS.txt)
      - name: Repeat accepted R18 CLP and general regression suite
        shell: bash
        run: |
          set -euo pipefail
          EVID=build/r18-compressor-arm-evidence
          OUT=build/r18-compressor-arm-host
          FLAGS="-std=c11 -O2 -fno-strict-aliasing -fsanitize=undefined,bounds,float-cast-overflow -fno-sanitize-recover=all -I. -Itests/fx_clip/include -ICore/Inc"
          mkdir -p "$OUT/clp-build"
          cc $FLAGS -DDISTORTION_SOURCE='"Core/Src/Soundengine/DSPAudio/FX/Distortion.c"' tests/fx_clip_r18/unit.c -lm -o "$OUT/clp-build/unit"
          "$OUT/clp-build/unit" 2>&1 | tee "$EVID/clp-unit.log"
          cc $FLAGS -DDISTORTION_SOURCE='"Core/Src/Soundengine/DSPAudio/FX/Distortion.c"' tests/fx_clip_r18/state.c -lm -o "$OUT/clp-build/state"
          "$OUT/clp-build/state" 2>&1 | tee "$EVID/clp-state.log"
          cc $FLAGS -DDISTORTION_SOURCE='"Core/Src/Soundengine/DSPAudio/FX/Distortion.c"' tests/fx_clip_r18/mix_bounds.c -lm -o "$OUT/clp-build/mix"
          "$OUT/clp-build/mix" 2>&1 | tee "$EVID/clp-mix.log"
          cc $FLAGS -ffunction-sections -fdata-sections tests/fx_clip/fxbus.c Core/Src/Soundengine/DSPAudio/FX/Distortion.c Core/Src/Soundengine/FxBus.c -Wl,--gc-sections -lm -o "$OUT/clp-build/bus"
          "$OUT/clp-build/bus" 2>&1 | tee "$EVID/clp-bus.log"
          python3 tests/fx_clip_r18/compare.py 2>&1 | tee "$EVID/clp-core.log"
          python3 tests/fx_clip_r14/max_control.py 2>&1 | tee "$EVID/clp-max.log"
          python3 tests/bug001/run.py 2>&1 | tee "$EVID/bug001.log"
          python3 tests/kit_load/run.py 2>&1 | tee "$EVID/kit-load.log"
          python3 tests/project_storage/run.py 2>&1 | tee "$EVID/storage.log"
          python3 tests/euclidean/run.py 2>&1 | tee "$EVID/euclidean.log"
      - name: Install exact R18 matched ARM GNU toolchain
        shell: bash
        run: |
          set -euo pipefail
          URL=https://armkeil.blob.core.windows.net/developer/Files/downloads/gnu/14.3.rel1/binrel/arm-gnu-toolchain-14.3.rel1-x86_64-arm-none-eabi.tar.xz
          curl -fL --retry 3 "$URL" -o "$RUNNER_TEMP/arm-toolchain.tar.xz"
          echo "8f6903f8ceb084d9227b9ef991490413014d991874a1e34074443c2a72b14dbd  $RUNNER_TEMP/arm-toolchain.tar.xz" | sha256sum --check
          sha256sum "$RUNNER_TEMP/arm-toolchain.tar.xz" > build/r18-compressor-arm-evidence/TOOLCHAIN_ARCHIVE_SHA256.txt
          tar -xJf "$RUNNER_TEMP/arm-toolchain.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/arm-gnu-toolchain-14.3.rel1-x86_64-arm-none-eabi/bin" >> "$GITHUB_PATH"
      - name: One Release ARM validation build (not an installation image)
        shell: bash
        run: |
          set -euo pipefail
          cmake --preset release 2>&1 | tee build/r18-compressor-arm-evidence/configure.log
          cmake --build --preset release --parallel 2 2>&1 | tee build/r18-compressor-arm-evidence/build.log
      - name: Verify ELF, IMG, R18 memory deltas and checksum
        shell: bash
        run: |
          set -euo pipefail
          EVID=build/r18-compressor-arm-evidence
          python3 tests/r18_compressor_mono/validate_arm.py 2>&1 | tee "$EVID/validation.log"
          cp build/release/LXR_V2_STM32F765.elf "$EVID/"
          cp build/release/LXR_V2_STM32F765.map "$EVID/"
          cp build/release/compile_commands.json "$EVID/"
          cp build/release/LXR_V2_V1.7.img "$EVID/LXR_R18_COMPRESSOR_ARM_VALIDATION_ONLY.img"
          arm-none-eabi-gcc --version > "$EVID/ARM_COMPILER.txt"
          git archive --format=zip --output="$EVID/SOURCE.zip" HEAD
          cat > "$EVID/NOT_FOR_FLASHING.txt" <<'EOF'
          This is an isolated Compressor ARM validation artifact, not an approved firmware release or installation image.
          It derives from accepted R18 and retains the R18 boot identifier.
          No flashing, integration, release or hardware test is authorized.
          CPU timing, IRQ/DMA deadlines, stack high-water, long-term reliability and physical sound are unmeasured.
          EOF
          (cd "$EVID" && sha256sum \
            LXR_R18_COMPRESSOR_ARM_VALIDATION_ONLY.img \
            LXR_V2_STM32F765.elf LXR_V2_STM32F765.map \
            SOURCE.zip ARM_VALIDATION.json > VERIFIED_HASHES.txt)
      - name: Preserve logs and hashes on completion or failure
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          EVID=build/r18-compressor-arm-evidence
          mkdir -p "$EVID"
          git rev-parse HEAD > "$EVID/CI_HEAD.txt"
          (cd "$EVID" && find . -maxdepth 1 -type f ! -name 'RECORD_HASHES.txt' -printf '%f\n' | LC_ALL=C sort | while IFS= read -r f; do sha256sum "$f"; done > RECORD_HASHES.txt)
      - name: Archive validation-only ARM evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r18-compressor-mono-arm-validation-evidence
          path: build/r18-compressor-arm-evidence/
          retention-days: 30
          if-no-files-found: error
