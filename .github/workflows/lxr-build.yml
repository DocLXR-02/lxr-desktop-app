
name: LXR Firmware Build

on:
  push:
    branches:
      - lab-setup

permissions:
  contents: read

jobs:
  build:
    name: Build original LXR firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout firmware source
        uses: actions/checkout@v4

      - name: Install Arm GNU Toolchain 14.3.rel1
        shell: bash
        run: |
          set -euo pipefail
          URL="https://armkeil.blob.core.windows.net/developer/Files/downloads/gnu/14.3.rel1/binrel/arm-gnu-toolchain-14.3.rel1-x86_64-arm-none-eabi.tar.xz"
          curl -fL --retry 3 "$URL" -o "$RUNNER_TEMP/arm-toolchain.tar.xz"
          tar -xJf "$RUNNER_TEMP/arm-toolchain.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/arm-gnu-toolchain-14.3.rel1-x86_64-arm-none-eabi/bin" >> "$GITHUB_PATH"

      - name: Show build tools
        run: |
          arm-none-eabi-gcc --version
          cmake --version
          ninja --version
          python3 --version
          git rev-parse HEAD

      - name: Configure release
        run: cmake --preset release

      - name: Compile firmware
        run: cmake --build --preset release --parallel 2

      - name: Record build information
        run: |
          sha256sum build/release/LXR_V2_V*.img build/release/LXR_V2_STM32F765.elf > build/release/SHA256SUMS
          git rev-parse HEAD > build/release/SOURCE_COMMIT.txt
          arm-none-eabi-gcc --version > build/release/TOOLCHAIN.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lxr-baseline-${{ github.sha }}
          path: |
            build/release/LXR_V2_V*.img
            build/release/LXR_V2_STM32F765.elf
            build/release/LXR_V2_STM32F765.map
            build/release/SHA256SUMS
            build/release/SOURCE_COMMIT.txt
            build/release/TOOLCHAIN.txt
          if-no-files-found: error
          retention-days: 7
