name: R20 REC status and global automation conflict ARM/host validation
on:
  push:
    branches:
      - feature/r20-rec-ux-global-conflict-2026-11-13
      - fix/r20-rec-step-notices-2026-11-13
      - fix/r20-target-names-2026-11-13
permissions:
  contents: read
jobs:
  r20-rec-ui-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record source identity
        run: |
          mkdir -p build/r20-rec-ui-evidence
          git rev-parse HEAD | tee build/r20-rec-ui-evidence/SOURCE_SHA.txt
          git -c core.whitespace=cr-at-eol diff --check HEAD^ HEAD
      - name: Compile and exercise standalone capture state machine
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c11 -O2 -Wall -Wextra -Werror -fsanitize=undefined,bounds -fno-sanitize-recover=all \
            -ICore/Inc Core/Src/Soundengine/Sequencer/automationCapture.c tests/bug008/host.c \
            -o build/r20-rec-ui-evidence/bug008-host
          build/r20-rec-ui-evidence/bug008-host 2>&1 | tee build/r20-rec-ui-evidence/bug008-host.log
      - name: Playback numerical regression (exhaustive fixed-8 equivalence)
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c11 -O2 -Wall -Wextra -Werror -fsanitize=undefined,bounds -fno-sanitize-recover=all \
            -ICore/Inc Core/Src/Soundengine/Sequencer/automationPlayback.c tests/automation_playback/host.c \
            -o build/r20-rec-ui-evidence/playback-host
          build/r20-rec-ui-evidence/playback-host 2>&1 | tee build/r20-rec-ui-evidence/playback-host.log
      - name: R20 host conflict and LCD timing regression
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/r20_ui/run.py 2>&1 | tee build/r20-rec-ui-evidence/r20-ui-host.log
          python3 tests/r20_ui/integration/probe.py . build/r20-ui-host 2>&1 | tee build/r20-rec-ui-evidence/r20-ui-integration.log
      - name: Verify adaptive source and extra menu choices removed
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -E 'PAR_AUTO_RES|PAR_AUTO_ALG|MENU_AUTO_RES|MENU_AUTO_ALG|SEQ_SET_AUTO_RES|SEQ_SET_AUTO_ALG|chooseDivisions|seq_playbackAdaptive|seq_playbackResolution|autoAlgNames|autoResNames' \
            Core/Inc Core/Src || exit 1
          grep -q 'lane->divisions = 8u;' Core/Src/Soundengine/Sequencer/automationPlayback.c
          grep -q 'PAR_AUTOM_TRACK.*PAR_REC_MODE.*PAR_NONE.*PAR_NONE' Core/Inc/menu/menuPages.h
          grep -q 'PAR_REC_MODE - PAR_BEGINNING_OF_GLOBALS' Core/Src/Preset/presetManager.c
      - name: Existing globals and project storage regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/project_storage/run.py 2>&1 | tee build/r20-rec-ui-evidence/project-storage.log
          python3 tests/project_transaction/run.py 2>&1 | tee build/r20-rec-ui-evidence/project-transaction.log
      - name: Reuse R19 regressions for USB-MIDI, Delay and Compressor
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/r18_delay_mono/run.py build/f8-delay 2>&1 | tee build/r20-rec-ui-evidence/delay.log
          python3 tests/r18_usb_midi/run.py build/f8-usb 2>&1 | tee build/r20-rec-ui-evidence/usb.log
          python3 tests/r18_compressor_mono/run.py build/f8-compressor 2>&1 | tee build/r20-rec-ui-evidence/compressor.log
          python3 tests/fx_clip_r18/compare.py 2>&1 | tee build/r20-rec-ui-evidence/clp-compare.log
      - name: Install R19-matched ARM GNU Toolchain 14.3.rel1
        shell: bash
        run: |
          set -euo pipefail
          URL=https://armkeil.blob.core.windows.net/developer/Files/downloads/gnu/14.3.rel1/binrel/arm-gnu-toolchain-14.3.rel1-x86_64-arm-none-eabi.tar.xz
          curl -fL --retry 3 "$URL" -o "$RUNNER_TEMP/arm-toolchain.tar.xz"
          echo "8f6903f8ceb084d9227b9ef991490413014d991874a1e34074443c2a72b14dbd  $RUNNER_TEMP/arm-toolchain.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/arm-toolchain.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/arm-gnu-toolchain-14.3.rel1-x86_64-arm-none-eabi/bin" >> "$GITHUB_PATH"
      - name: Build candidate firmware (validation only)
        shell: bash
        run: |
          set -euo pipefail
          cmake --preset release 2>&1 | tee build/r20-rec-ui-evidence/configure.log
          cmake --build --preset release --parallel 2 2>&1 | tee build/r20-rec-ui-evidence/build.log
          arm-none-eabi-size -A build/release/LXR_V2_STM32F765.elf 2>&1 | tee build/r20-rec-ui-evidence/sections.log
          arm-none-eabi-gcc --version > build/r20-rec-ui-evidence/COMPILER.txt
          cp build/release/LXR_V2_STM32F765.map build/r20-rec-ui-evidence/
          cp build/release/LXR_V2_STM32F765.elf build/r20-rec-ui-evidence/
          cp build/release/LXR_V2_V1.7.img build/r20-rec-ui-evidence/LXR_V2_R20_CANDIDATE_NOT_FOR_FLASH.img
          (cd build/r20-rec-ui-evidence && sha256sum LXR_V2_R20_CANDIDATE_NOT_FOR_FLASH.img LXR_V2_STM32F765.elf LXR_V2_STM32F765.map > OUTPUT_SHA256SUMS.txt)
          echo "R20 REC UI TEST CANDIDATE; OWNER DEVICE TEST PENDING; R18/R19/FIX8 PROTECTED; NO STABLE RELEASE." > build/r20-rec-ui-evidence/NOT_FOR_FLASHING.txt
      - name: Preserve evidence also on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r20-rec-ui-build-evidence
          path: build/r20-rec-ui-evidence/
          retention-days: 30
          if-no-files-found: error
